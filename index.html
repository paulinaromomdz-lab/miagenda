function saveTaskCategory(id){

  const name=document
    .getElementById("taskCategoryName")
    .value
    .trim();

  if(!name){

    toast("Escribe un nombre para la categoría");

    return;
  }

  const icon=document
    .getElementById("taskCategoryIcon")
    .value;

  const color=document
    .getElementById("taskCategoryColor")
    .value;

  const useSubcategories=document
    .getElementById("taskUseSubcategories")
    .checked;


  let category=getTaskCategory(id);

  if(!category){

    category={
      id:id,
      name:name,
      icon:icon||"📋",
      color:color||TASK_COLORS[0],
      useSubcategories:useSubcategories,
      subcategories:[]
    };

    state.taskCategories.push(category);

  }else{

    category.name=name;
    category.icon=icon||"📋";
    category.color=color||TASK_COLORS[0];
    category.useSubcategories=useSubcategories;

  }

  save();

  openTaskCategories();

}


function removeTaskCategory(id){

  const category=getTaskCategory(id);

  if(!category)return;

  if(!confirm(
    "¿Eliminar la categoría \""+
    category.name+
    "\"?"
  ))return;


  state.taskCategories=
    state.taskCategories.filter(c=>c.id!==id);


  Object.keys(state.taskCategoryAssignments||{})
    .forEach(key=>{

      if(
        state.taskCategoryAssignments[key].categoryId===id
      ){

        delete state.taskCategoryAssignments[key];

      }

function addTaskSubcategory(categoryId){

  const category=getTaskCategory(categoryId);

  if(!category)return;

  category.subcategories=category.subcategories||[];

  const subcategory={
    id:"sub_"+Date.now(),
    name:"",
    icon:"📋"
  };

  category.subcategories.push(subcategory);

  save();

  editTaskSubcategory(
    categoryId,
    subcategory.id

}

function saveTaskSubcategory(categoryId,subcategoryId){

  const category=getTaskCategory(categoryId);

  if(!category)return;

  const subcategory=
    category.subcategories.find(
      s=>s.id===subcategoryId
    );

  if(!subcategory)return;


  const name=document
    .getElementById("taskSubcategoryName")
    .value
    .trim();

  if(!name){

    toast("Escribe un nombre");

    return;
  }


  subcategory.name=name;

  subcategory.icon=
    document.getElementById("taskSubcategoryIcon").value
    ||"📋";


  save();

  editTaskCategory(categoryId);

}


function removeTaskSubcategory(categoryId,subcategoryId){

  const category=getTaskCategory(categoryId);

  if(!category)return;

  if(!confirm("¿Eliminar esta subcategoría?"))return;


  category.subcategories=
    category.subcategories.filter(
      s=>s.id!==subcategoryId
    );


  Object.keys(state.taskCategoryAssignments||{})
    .forEach(key=>{

      if(
        state.taskCategoryAssignments[key].subcategoryId===
        subcategoryId
      ){

        state.taskCategoryAssignments[key].subcategoryId="";

      }

    });


  save();

  editTaskCategory(categoryId);

}


function setTaskCategory(key,categoryId){

  state.taskCategoryAssignments[key]={

function aiView(){
 return `<div class="card"><h2>✨ Organiza mi día</h2><p class="small">Esta versión ya puede interpretar algunas instrucciones sin conexión. La siguiente fase puede conectar una IA real para modificar tu horario mediante conversación.</p><textarea id="aiq" placeholder="Ej.: No voy al gym hoy y necesito hacer compras antes de las 7."></textarea><div class="actions"><button class="primary" onclick="ask()">Organizar</button><button class="secondary" onclick="setTab('day')">Volver a hoy</button></div><div id="answer"></div></div>`;

async function ask(){
  const input = document.getElementById("aiq");
  const answer = document.getElementById("answer");
  const message = input.value.trim();

  if(!message){
    answer.innerHTML = `<div class="now" style="margin-top:12px">
      <div class="label">ASISTENTE</div>
      <p>Escríbeme qué necesitas organizar 💗</p>
    </div>`;
    return;
  }

  answer.innerHTML = `<div class="now" style="margin-top:12px">
    <div class="label">ASISTENTE</div>
    <p>✨ Estoy revisando tu agenda...</p>
  </div>`;

  try{
    const context = JSON.stringify({
      dia_actual: state.day,
      agenda: state.customSchedule[state.day],
      pendientes: state.tasks,
      compras: shopping,
      pendientes_base: baseTasks,
      entrenamientos: workouts
    });

    const response = await fetch("https://miagenda-tan.vercel.app/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message,
        context
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Error al consultar la IA");
    }

    answer.innerHTML = `<div class="now" style="margin-top:12px">
      <div class="label">ASISTENTE</div>
      <p>${esc(data.answer || "No recibí una respuesta.")}</p>
    </div>`;

  }catch(error){
    answer.innerHTML = `<div class="now" style="margin-top:12px">
      <div class="label">ASISTENTE</div>
      <p>⚠️ Error: ${error.message || error}</p>
    </div>`;
  }
}

function captureEditDayDraft(){
  if(!editDayDraft)return;

  editDayDraft.forEach((x,i)=>{

    const c=document.getElementById("c"+i);
    const icon=document.getElementById("i"+i);

    if(t)x[0]=t.value;
    if(d)x[1]=d.value;
    if(c)x[2]=c.value;
    if(icon)x[3]=icon.value;
  });
}

async function signUp() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;

  const message = document.getElementById("auth-message");

  if (!email || !password) {
    message.textContent = "Escribe tu correo y contraseña.";
    return;
  }

  const { error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent =
    "✨ Cuenta creada. Revisa tu correo para confirmar tu cuenta.";
}

async function signIn() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;

  const message = document.getElementById("auth-message");

  if (!email || !password) {
    message.textContent = "Escribe tu correo y contraseña.";
    return;
  }
try {
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  showApp();
  } catch (e) {
  message.textContent = "Error: " + e.message;
}
}

function showApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "";
  render();
}

function showLogin() {
  document.getElementById("auth-screen").style.display = "block";
  document.getElementById("app").style.display = "none";
}

async function checkAuth() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    showApp();
  } else {
    showLogin();
  }
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    showApp();
  } else {
    showLogin();
  }
});

checkAuth();
